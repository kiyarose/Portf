# Wrangler configuration for Cloudflare Pages.
# Deploy with `npx wrangler pages deploy dist --project-name <your-project-name>`.

name = "template-portfolio"
compatibility_date = "2024-05-17"
pages_build_output_dir = "dist"
build_command = "npm run build"

# Uncomment to surface non-sensitive environment variables when needed.
# [vars]
# VITE_PAGECLIP_API_KEY = ""
# VITE_TURNSTILE_SITE_KEY = ""
# VITE_TURNSTYLE_SITE = ""
#
# Remote data admin editor (opt-in — also set PF_ALLOW_NOEDIT=1 at build time)
# PF_ALLOW_NOEDIT = "1"
# PF_DATA_BASE_URL = "https://data.example.com/data"
#
# Bind PF_EDADMIN_TOKEN as an encrypted secret in the Cloudflare dashboard
# (never expose it to VITE_* or client code).
